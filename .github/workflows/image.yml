name: Build base2 image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base2-image-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
      changed: ${{ steps.versions.outputs.changed }}
      refresh_metadata: ${{ steps.versions.outputs.refresh_metadata }}
      inputs_artifact: ${{ steps.meta.outputs.inputs_artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test resolution and publication
        run: python3 -m unittest discover -s tests -v

      # Only the fallback APT simulation needs emulation. Image installation and
      # acceptance run on native hardware in the matrix below.
      - name: Set up emulation for APT planning
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image and input bundle names
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/base2" >> "$GITHUB_OUTPUT"
          echo "inputs_artifact=resolved-inputs-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve inputs and compare the base2 image
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.meta.outputs.image }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--image "$IMAGE" --tag latest --revision "$GITHUB_SHA")
          if [[ "$EVENT_NAME" == schedule ]]; then args+=(--check); fi
          python3 scripts/resolve-versions.py "${args[@]}"

      - name: Bundle the exact resolved inputs
        if: steps.versions.outputs.changed == 'true' || steps.versions.outputs.refresh_metadata == 'true'
        run: |
          tar -C .build -czf "$RUNNER_TEMP/resolved-inputs.tar.gz" \
            versions.json published.json build-args.env apt-ca.pem apt tools

      - name: Share resolved inputs
        if: steps.versions.outputs.changed == 'true' || steps.versions.outputs.refresh_metadata == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.inputs_artifact }}
          path: ${{ runner.temp }}/resolved-inputs.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and test ${{ matrix.arch }} (native)
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      IMAGE: ${{ needs.resolve.outputs.image }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify native architecture
        run: test "$(dpkg --print-architecture)" = "$ARCH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.resolve.outputs.inputs_artifact }}
          path: ${{ runner.temp }}

      - name: Restore resolved inputs
        run: |
          mkdir -p .build
          tar -C .build -xzf "$RUNNER_TEMP/resolved-inputs.tar.gz"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: bash scripts/build-image.sh "$ARCH" load

      - name: Test
        run: |
          set -euo pipefail
          mkdir -p .build/acceptance
          python3 tests/shared_nix_store/acceptance.py \
            --image "$IMAGE:shared-nix-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" \
            --platform "linux/$ARCH" 2>&1 | tee ".build/acceptance/$ARCH.log"

      - name: Publish tested architecture
        if: github.event_name != 'pull_request'
        run: bash scripts/build-image.sh "$ARCH" push

      # Retain exact digests, not attempt-derived tag names: rerunning a failed
      # matrix job must still combine correctly with the successful sibling.
      - name: Share published digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-metadata-${{ matrix.arch }}
          path: .build/image-${{ matrix.arch }}.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: [resolve, build]
    if: >-
      always() && needs.resolve.result == 'success' && github.event_name != 'pull_request' &&
      ((needs.resolve.outputs.changed == 'true' && needs.build.result == 'success') ||
       (needs.resolve.outputs.changed == 'false' && needs.resolve.outputs.refresh_metadata == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.resolve.outputs.inputs_artifact }}
          path: ${{ runner.temp }}
      - name: Restore resolved manifest
        run: |
          mkdir -p .build
          tar -C .build -xzf "$RUNNER_TEMP/resolved-inputs.tar.gz" versions.json published.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.resolve.outputs.changed == 'true'
        with:
          pattern: image-metadata-*
          merge-multiple: true
          path: .build/images
      - name: Publish both tested digests
        if: needs.resolve.outputs.changed == 'true'
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: python3 scripts/publish-image.py
      - name: Refresh comparison metadata without rebuilding
        if: needs.resolve.outputs.changed == 'false'
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: python3 scripts/publish-image.py --refresh

  summary:
    needs: [resolve, build, publish]
    if: always() && needs.resolve.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          CHANGED: ${{ needs.resolve.outputs.changed }}
          REFRESH: ${{ needs.resolve.outputs.refresh_metadata }}
          EVENT_NAME: ${{ github.event_name }}
          RESOLUTION: ${{ needs.resolve.result }}
          BUILD: ${{ needs.build.result }}
          PUBLICATION: ${{ needs.publish.result }}
        run: |
          {
            if [[ "$RESOLUTION" != success ]]; then
              echo 'Input resolution did not complete successfully.'
            elif [[ "$CHANGED" != true && "$REFRESH" == true && "$PUBLICATION" != success ]]; then
              echo 'Comparison metadata refresh did not complete successfully.'
            elif [[ "$CHANGED" != true ]]; then
              echo 'Skipped: resolved inputs and source revision are unchanged.'
            elif [[ "$BUILD" != success ]]; then
              echo 'Build/test failed or was cancelled; latest was not published.'
            elif [[ "$EVENT_NAME" == pull_request ]]; then
              echo 'Validated amd64 and arm64 on native runners; no image published.'
            elif [[ "$PUBLICATION" != success ]]; then
              echo 'Multi-platform publication did not complete successfully.'
            else
              echo "Published $IMAGE:latest and shared-nix-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
