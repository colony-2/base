name: Build base2 image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base2-image-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test version resolution and change detection
        run: python3 -m unittest discover -s tests -v

      - name: Set up emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64,amd64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/base2" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve inputs and compare the base2 image
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.meta.outputs.image }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--image "$IMAGE" --tag latest --revision "$GITHUB_SHA")
          if [[ "$EVENT_NAME" == schedule ]]; then args+=(--check); fi
          python3 scripts/resolve-versions.py "${args[@]}"

      # Test the delivered filesystem in disposable containers. No test store
      # enters an image layer. Publish the common tag only after BOTH pass.
      - name: Build and validate both architectures
        if: steps.versions.outputs.changed == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .build/acceptance
          args=()
          while IFS= read -r arg; do args+=(--build-arg "$arg"); done < .build/build-args.env
          for arch in amd64 arm64; do
            tag="$IMAGE:shared-nix-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            build_options=(--platform "linux/$arch" "${args[@]}" -t "$tag"
              --label "org.opencontainers.image.revision=$GITHUB_SHA"
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
              --cache-from "type=registry,ref=$IMAGE:latest" --cache-to type=inline)
            docker buildx build "${build_options[@]}" --load .
            python3 tests/shared_nix_store/acceptance.py --image "$tag" --platform "linux/$arch" \
              2>&1 | tee ".build/acceptance/$arch.log"
            if [[ "$EVENT_NAME" != pull_request ]]; then
              # Re-export the cached, tested build as OCI. A classic Docker
              # load/push can convert it to schema2 and lose index annotations,
              # which would break the hourly fingerprint check.
              docker buildx build "${build_options[@]}" --output type=image,push=true,oci-mediatypes=true .
            fi
          done

      - name: Publish the tested multi-platform base2 image
        if: steps.versions.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          FINGERPRINT: ${{ steps.versions.outputs.fingerprint }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:shared-nix-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --annotation "index:io.colony-2.base.inputs=$FINGERPRINT" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "$IMAGE:shared-nix-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$IMAGE:shared-nix-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"

      - name: Summarize
        if: always()
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          CHANGED: ${{ steps.versions.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "Job status: $STATUS"
            if [[ "$STATUS" != success ]]; then
              echo 'Failed: the latest publication was not completed.'
            elif [[ "$CHANGED" != true ]]; then
              echo 'Skipped: resolved inputs and source revision are unchanged.'
            elif [[ "$EVENT_NAME" == pull_request ]]; then
              echo 'Validated amd64 and arm64; no image published.'
            else
              echo "Published $IMAGE:latest and shared-nix-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT."
            fi
            echo 'The base2 image has a separate contract from the existing base image.'
            if [[ -f .build/versions.json ]]; then
              echo '```json'
              cat .build/versions.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
