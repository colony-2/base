# Deliberately no input_schema: the caller also supplies optional/null/value settings.
id: base-local-verify
inputs:
  api_version: ${{ inputs.api_version }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.target_directory }}
  documents: ${{ inputs.documents }}
  settings: ${{ inputs.?settings.orValue(null) }}
  candidate: ${{ inputs.candidate }}
  base: ${{ inputs.base }}
sequence:
- id: resolution
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
  inputs:
    env:
      ROOT: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
      BASE: ${{ inputs.base }}
    run: python3 -B "$ROOT/scripts/verify-local.py" resolution
- id: publication_planning
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
  inputs:
    env:
      ROOT: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
      BASE: ${{ inputs.base }}
    run: python3 -B "$ROOT/scripts/verify-local.py" publication_planning
- id: fast_resolution
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
  inputs:
    env:
      ROOT: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
      BASE: ${{ inputs.base }}
    run: python3 -B "$ROOT/scripts/verify-local.py" fast_resolution
- id: smoke_versions
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
  inputs:
    env:
      ROOT: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
      BASE: ${{ inputs.base }}
    run: python3 -B "$ROOT/scripts/verify-local.py" smoke_versions
- id: image
  op: command_execution
  const: true
  execution_needs:
    base: 'ubuntu*'
    capabilities: [docker]
  inputs:
    timeout: 110m
    env:
      ROOT: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
      BASE: ${{ inputs.base }}
    run: python3 -B "$ROOT/scripts/verify-image.py"
- id: aggregate
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
  artifacts:
    resolution.json: ${{ sequence.resolution.artifacts['resolution.json'] }}
    resolution.log: ${{ sequence.resolution.artifacts['resolution.log'] }}
    publication_planning.json: ${{ sequence.publication_planning.artifacts['publication_planning.json'] }}
    publication_planning.log: ${{ sequence.publication_planning.artifacts['publication_planning.log'] }}
    fast_resolution.json: ${{ sequence.fast_resolution.artifacts['fast_resolution.json'] }}
    fast_resolution.log: ${{ sequence.fast_resolution.artifacts['fast_resolution.log'] }}
    smoke_versions.json: ${{ sequence.smoke_versions.artifacts['smoke_versions.json'] }}
    smoke_versions.log: ${{ sequence.smoke_versions.artifacts['smoke_versions.log'] }}
    image.json: ${{ sequence.image.artifacts['image.json'] }}
    image-preflight.log: ${{ sequence.image.artifacts['image-preflight.log'] }}
    image-resolution.log: ${{ sequence.image.artifacts['image-resolution.log'] }}
    image-build.log: ${{ sequence.image.artifacts['image-build.log'] }}
    image-acceptance.log: ${{ sequence.image.artifacts['image-acceptance.log'] }}
    image-cleanup.log: ${{ sequence.image.artifacts['image-cleanup.log'] }}
  inputs:
    env:
      ROOT: ${{ context.environment.op.worktree_path }}
      INBOX: ${{ context.environment.op.inbox }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
      BASE: ${{ inputs.base }}
    run: python3 -B "$ROOT/scripts/verify-local.py" aggregate
outputs:
  api_version: c2.build-hook/v1
  status: ${{ sequence.aggregate.outputs.stdout }}
  summary: Inspect verification.md and the logs for native image, offline test and discovery results. No image publication runs.
  artifact_refs:
    resolution.json: ${{ sequence.resolution.artifacts['resolution.json'] }}
    resolution.log: ${{ sequence.resolution.artifacts['resolution.log'] }}
    publication_planning.json: ${{ sequence.publication_planning.artifacts['publication_planning.json'] }}
    publication_planning.log: ${{ sequence.publication_planning.artifacts['publication_planning.log'] }}
    fast_resolution.json: ${{ sequence.fast_resolution.artifacts['fast_resolution.json'] }}
    fast_resolution.log: ${{ sequence.fast_resolution.artifacts['fast_resolution.log'] }}
    smoke_versions.json: ${{ sequence.smoke_versions.artifacts['smoke_versions.json'] }}
    smoke_versions.log: ${{ sequence.smoke_versions.artifacts['smoke_versions.log'] }}
    verification.md: ${{ sequence.aggregate.artifacts['verification.md'] }}
    environment.json: ${{ sequence.aggregate.artifacts['environment.json'] }}
    image.json: ${{ sequence.image.artifacts['image.json'] }}
    image-preflight.log: ${{ sequence.image.artifacts['image-preflight.log'] }}
    image-resolution.log: ${{ sequence.image.artifacts['image-resolution.log'] }}
    image-build.log: ${{ sequence.image.artifacts['image-build.log'] }}
    image-acceptance.log: ${{ sequence.image.artifacts['image-acceptance.log'] }}
    image-cleanup.log: ${{ sequence.image.artifacts['image-cleanup.log'] }}
